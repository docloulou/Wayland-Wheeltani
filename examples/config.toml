# Example configuration for wayland-wheeltani.
#
# Copy this to ~/.config/Wayland-Wheeltani/config.toml and adjust to taste.
# Every field is optional: missing values fall back to the built-in defaults
# shown below. CLI flags always override config file values.
#
# NOTE on TOML ordering: plain `key = value` settings must appear BEFORE any
# `[table]` or `[[array.of.tables]]` header (such as `[[scroll_speed_steps]]`
# or `[foreground]`), otherwise TOML attaches them to that table instead of the
# top level.

# --- device selection ------------------------------------------------------
#
# Two ways to point the daemon at your mouse:
#
# 1) (RECOMMENDED) Match by USB ids; stable across reboots, USB renumbering,
#    and across USB ports. Generated automatically by `wayland-wheeltani
#    --setup`. Find candidates and their ids with `--list-devices` (look at
#    `usb-id: vvvv:pppp`).
#
#    [device_match]
#    vendor_id = "046d"
#    product_id = "c539"
#    # name = "Logitech USB Receiver"   # optional, disambiguates duplicates
#    # phys = "usb-0000:00:14.0-5/input2"  # optional, pin to a specific USB
#    #                                     # port; added by `--setup --pin-port`.
#    #                                     # Omit it (default) to match on any port.
#
# 2) (LEGACY) Hard-code the evdev node. The kernel renumbers `eventXX` on
#    every reboot, so this is fragile; prefer `[device_match]` instead.
#
#    device = "/dev/input/event12"

# Whether to grab the physical device exclusively. With grab=true the
# compositor only sees the synthetic events from the virtual mouse, which is
# necessary to suppress middle-click and movement during scroll mode.
grab = true

# Pretend mode: do not create the /dev/uinput virtual mouse and only log
# what would have been emitted. Useful for development and CI.
dry_run = false

# Auto-exit after N seconds. Strongly recommended during development so a
# bug in the daemon cannot leave your mouse permanently grabbed.
# safety_timeout_seconds = 60

# ---- core engine ----------------------------------------------------------

# Only mode supported in V1.
mode = "hold_progressive"

# Vertical pixels of slack around the press position before scroll engages.
# Movements within +/- deadzone_units do nothing (and a release in this band
# emits a normal middle click).
deadzone_units = 10

# Vertical distance from the deadzone edge that maps to "max scroll speed".
# Smaller value = reaches max speed sooner.
full_speed_units = 120

# Hard cap on |offset_y|. Beyond this, additional motion is ignored so the
# scroll cannot keep accelerating off-screen.
max_offset_units = 240

# Scroll velocity envelope, expressed in classic wheel detents per second.
# 1.5 detent/s feels like a slow, deliberate page glide.
# 32 detent/s feels close to "fling".
min_speed_detents_per_second = 1.5
max_speed_detents_per_second = 32.0

# Curve shape for the speed mapping (1.0 = linear, >1 = soft start, <1 = aggressive).
# Used only when scroll_speed_steps is empty.
acceleration_exponent = 1.6

# Internal scroll emission rate. 120 Hz matches the rate at which most
# Wayland compositors poll input.
tick_hz = 120

# Flip vertical scroll direction (i.e. natural / "Mac-style" scrolling).
invert_vertical = false

# Flip horizontal scroll direction. Only applies when horizontal_scroll = true.
invert_horizontal = false

# While the middle button is held, suppress raw cursor motion so the pointer
# does not drift. Recommended.
suppress_motion_while_pending = true
suppress_motion_while_scrolling = true

# When a short middle click is detected (release inside the deadzone) and
# the user moved a tiny amount during the press, replay that motion just
# before the synthetic click. Off by default for predictability.
replay_pending_motion_on_click = false

# Emit REL_WHEEL_HI_RES (1 detent = 120 hi-res units) for smooth scrolling
# in modern apps. Emit REL_WHEEL too for legacy app compatibility. Both ON
# by default and matches what physical hi-res wheels do.
emit_hires_wheel = true
emit_legacy_wheel = true

# Minimum accumulated hi-res units before emitting a hi-res wheel event.
# 120 units = one detent; 15 units = 8 smooth samples per detent. Raising this
# can reduce tiny uinput events in applications that stutter under high-rate
# synthetic scrolling. Lowering it can make modern hi-res-aware apps feel more
# continuous at very slow speeds.
min_hires_units_per_event = 15

# Enable horizontal scroll. When true (default), horizontal pointer motion
# (REL_X) past the deadzone enters scroll mode and emits horizontal wheel
# events using the same `scroll_speed_steps` and `deadzone_units` as the
# vertical axis. Both axes can scroll simultaneously when the pointer moves
# diagonally. Set to false to restrict autoscroll to the vertical axis only.
horizontal_scroll = true

# Safety cap on the number of detents emitted in a single tick. Prevents a
# pathologically large dt (e.g. system was paused) from generating a giant
# scroll burst.
max_detents_per_tick = 4

# Scroll speed profile by vertical distance from the middle-button press point.
# distance_units is an absolute evdev REL_Y distance, not just distance beyond
# the deadzone. The last reached step controls the speed. Direction is still
# determined by whether you moved down or up from the original press point.
#
# Example: with the defaults below, moving 40 units away scrolls at 4 detents/s;
# moving 140 units away scrolls at 18 detents/s.
[[scroll_speed_steps]]
distance_units = 11
speed_detents_per_second = 1.5

[[scroll_speed_steps]]
distance_units = 40
speed_detents_per_second = 4.0

[[scroll_speed_steps]]
distance_units = 80
speed_detents_per_second = 10.0

[[scroll_speed_steps]]
distance_units = 140
speed_detents_per_second = 18.0

[[scroll_speed_steps]]
distance_units = 220
speed_detents_per_second = 32.0

# ---- foreground application filter (optional) -----------------------------
#
# Enable or disable autoscroll depending on the focused application. Disabled
# by default, so leaving this table out keeps the historical behaviour. When an
# app is "disabled", mouse events are passed straight through (the middle click
# works normally in that app); only the autoscroll gesture is suppressed.
#
# The decision is taken once when the middle button goes down and held until it
# is released, so changing focus mid-scroll never corrupts a gesture.
#
# Tip: run `wayland-wheeltani --detect-foreground`, focus the target window
# during the countdown, and it prints the exact string to put in deny_apps /
# allow_apps (works with every provider).
#
# [foreground]
# enabled = false
#
# provider = "auto"          # auto | none | hyprland | sway | gnome | kde | command
#   # "auto" tries, in order: hyprland, sway, gnome (needs the bundled GNOME
#   # Shell extension), kde (needs the `kdotool` helper), command, then none.
#
# mode = "denylist"          # denylist | allowlist
# unknown_policy = "enabled" # enabled | disabled  (used when the focused app
#                            # cannot be determined; "enabled" never breaks an
#                            # existing setup)
#
# # Matching is case-insensitive against app_id, class and resource_class
# # (and title only when match_title = true). A trailing ".desktop" is ignored.
# allow_apps = []
# deny_apps = []
# match_title = false
#
# # Only used with provider = "command":
# command = []
# command_refresh_ms = 500

# --- Example: denylist (autoscroll everywhere except these apps) ------------
# [foreground]
# enabled = true
# provider = "auto"
# mode = "denylist"
# unknown_policy = "enabled"
# deny_apps = ["firefox", "org.mozilla.firefox", "steam", "blender"]

# --- Example: strict allowlist (autoscroll only in these apps) --------------
# [foreground]
# enabled = true
# provider = "auto"
# mode = "allowlist"
# unknown_policy = "disabled"
# allow_apps = ["firefox", "org.mozilla.firefox", "chromium", "code"]

# --- Example: GNOME (needs the bundled GNOME Shell extension) ---------------
# Install it with: integrations/gnome/install.sh  (then log out/in on Wayland)
# [foreground]
# enabled = true
# provider = "gnome"
# mode = "denylist"
# deny_apps = ["firefox", "org.gnome.Nautilus"]

# --- Example: KDE Plasma / KWin (needs the `kdotool` helper) ----------------
# Install kdotool (https://github.com/jinliu/kdotool), e.g. `cargo install
# kdotool` or your distro's package. "auto" also picks KDE when kdotool is
# present. command_refresh_ms controls how often the active window is polled.
# [foreground]
# enabled = true
# provider = "kde"
# mode = "denylist"
# deny_apps = ["firefox", "org.kde.dolphin"]
# command_refresh_ms = 500

# --- Example: external command (KWin, unsupported compositors, scripts) -----
# The command prints the focused app id on stdout (plain text), or a JSON
# object: {"app_id":"...","class":"...","title":"...","pid":123}
# [foreground]
# enabled = true
# provider = "command"
# mode = "denylist"
# deny_apps = ["krita", "blender"]
# command = ["wheeltani-current-app"]
# command_refresh_ms = 500
