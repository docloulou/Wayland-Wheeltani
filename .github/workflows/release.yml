name: Release Linux binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version/tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

env:
  BIN_NAME: wayland-wheeltani
  PACKAGE: wayland-wheeltani
  CARGO_TERM_COLOR: always
  # The input only ever reaches scripts through this variable, never through
  # `${{ }}` inside a script, so it cannot inject shell code.
  VERSION: ${{ inputs.version }}
  # A fixed Zig keeps release builds reproducible (cargo-zigbuild links with it).
  ZIG_VERSION: "0.13.0"

jobs:
  verify:
    name: Verify version, run tests, generate docs
    runs-on: ubuntu-latest
    steps:
      - name: Validate version input
        run: |
          set -euo pipefail
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version must look like v0.1.0, v1.2.3-beta.1, etc." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check the tag matches Cargo.toml
        run: |
          set -euo pipefail
          crate_version="$(cargo metadata --no-deps --format-version 1 --locked |
            jq -r '.packages[] | select(.name == env.PACKAGE) | .version')"
          if [[ "v${crate_version}" != "$VERSION" ]]; then
            echo "$PACKAGE is version ${crate_version} in Cargo.toml but the release is ${VERSION}." >&2
            echo "Run scripts/bump-version.sh first." >&2
            exit 1
          fi

      - name: Test
        run: cargo test --workspace --locked

      # The cross-compiled aarch64 binary cannot run here, and the man pages
      # and completions do not depend on the architecture: generate them once
      # from a host build and ship them in every archive.
      - name: Generate man pages and completions
        run: |
          set -euo pipefail
          cargo build --locked -p "$PACKAGE"
          scripts/generate-assets.sh target/debug dist/assets

      - name: Upload man pages and completions
        uses: actions/upload-artifact@v4
        with:
          name: assets
          path: dist/assets
          if-no-files-found: error

  build:
    name: Build ${{ matrix.label }}
    runs-on: ubuntu-latest
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            label: linux-x86_64-gnu
          - target: aarch64-unknown-linux-gnu
            label: linux-aarch64-gnu
    env:
      TARGET: ${{ matrix.target }}
      LABEL: ${{ matrix.label }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cargo-zigbuild, cargo-deb, and cargo-generate-rpm
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild,cargo-deb,cargo-generate-rpm

      - name: Build release binaries
        run: cargo zigbuild --release --locked -p "$PACKAGE" --target "$TARGET"

      - name: Download man pages and completions
        uses: actions/download-artifact@v4
        with:
          name: assets
          path: target/assets

      - name: Package binaries
        run: |
          set -euo pipefail
          name="${BIN_NAME}-${VERSION}-${LABEL}"
          staging="dist/${name}"

          mkdir -p "$staging" target/release
          cp "target/${TARGET}/release/${BIN_NAME}" "target/${TARGET}/release/wlw" "$staging/"
          cp "target/${TARGET}/release/${BIN_NAME}" "target/${TARGET}/release/wlw" target/release/
          cp README.md LICENSE CHANGELOG.md "$staging/"
          cp -R contrib integrations examples "$staging/"
          cp -R target/assets/man target/assets/completions "$staging/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"

          cargo deb -p "$PACKAGE" --no-build --no-strip --target "$TARGET" -o dist/
          cargo generate-rpm -p crates/middle-scroll-linux --target "$TARGET" -o dist/

          (
            cd dist
            for pkg in *.tar.gz *.deb *.rpm; do
              sha256sum "$pkg" >"${pkg}.sha256"
            done
          )

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.label }}
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm
            dist/*.sha256
          if-no-files-found: error

  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: linux-*
          merge-multiple: true

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release $VERSION already exists; uploading/replacing assets."
            gh release upload "$VERSION" dist/* --clobber
            exit 0
          fi

          args=(--title "Wayland-Wheeltani ${VERSION}" --target "$GITHUB_SHA")
          notes="release_notes/RELEASE_NOTES_${VERSION}.md"
          if [[ -f "$notes" ]]; then
            args+=(--notes-file "$notes")
          else
            args+=(--notes "Linux release binaries for Wayland-Wheeltani ${VERSION}.")
          fi
          # A -beta.N version is a semver pre-release.
          if [[ "$VERSION" == *-* ]]; then
            args+=(--prerelease)
          fi
          gh release create "$VERSION" dist/* "${args[@]}"

  publish-crates:
    name: Publish crates.io packages
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Publish workspace crates
        uses: katyo/publish-crates@v2
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          ignore-unpublished-changes: true
